seed: 42


# Models are instantiated using skrl's model instantiator utility
# https://skrl.readthedocs.io/en/latest/api/utils/model_instantiators.html
models:
  separate: False
  policy:
    class: GaussianMixin
    clip_actions: False
    clip_log_std: True
    min_log_std: -20.0
    max_log_std: 0.5
    initial_log_std: 0.0
    network:
      - name: net
        input: STATES
        layers: [256, 128, 64]
        activations: elu
    output: ACTIONS
  value:
    class: DeterministicMixin
    clip_actions: False
    network:
      - name: net
        input: STATES
        layers: [256, 128, 64]
        activations: elu
    output: ONE


# Rollout memory
# https://skrl.readthedocs.io/en/latest/api/memories/random.html
memory:
  class: RandomMemory
  memory_size: -1


# PPO agent configuration (field names are from PPO_DEFAULT_CONFIG)
# https://skrl.readthedocs.io/en/latest/api/agents/ppo.html
agent:
  class: PPO
  rollouts: 64
  learning_epochs: 5
  mini_batches: 4
  discount_factor: 0.99
  lambda: 0.95
  learning_rate: 1.0e-04
  learning_rate_scheduler: KLAdaptiveLR
  learning_rate_scheduler_kwargs:
    kl_threshold: 0.008
  state_preprocessor: RunningStandardScaler
  state_preprocessor_kwargs: null
  value_preprocessor: RunningStandardScaler
  value_preprocessor_kwargs: null
  random_timesteps: 0
  learning_starts: 0
  grad_norm_clip: 1.0
  ratio_clip: 0.2
  value_clip: 0.2
  clip_predicted_values: True
  entropy_loss_scale: 0.01
  value_loss_scale: 1.0
  kl_threshold: 0.0
  rewards_shaper_scale: 1.0
  time_limit_bootstrap: False
  experiment:
    directory: "blocked_recovery"
    experiment_name: ""
    write_interval: 500
    checkpoint_interval: 2000
    wandb: True
    wandb_kwargs:
      project: "blocked-recovery-ppo"
      entity: "chja_jiangxin-huazhong-university-of-science-and-technology"
      mode: "online"
      sync_tensorboard: True
      save_code: True
      tags: ["isaaclab", "skrl", "ppo", "blocked_recovery", "primitive_action"]
      notes: "BlockedRecovery first-stage PPO: curb_momentum_loss with Box(6) primitive selection."
      config:
        task: "Isaac-Navigation-Car-Dreamer-BlockedRecovery-v0"
        algorithm: "PPO"
        action_type: "RecoveryPrimitiveAction"
        action_dim: 6
        primitive_actions:
          - "continue_forward"
          - "slow_forward"
          - "reverse"
          - "stop_protect"
          - "turn_left_escape"
          - "turn_right_escape"
        scenario_weights: [1.0, 0.0, 0.0]
        scenario_stage: "curb_momentum_loss"


# Sequential trainer
# https://skrl.readthedocs.io/en/latest/api/trainers/sequential.html
trainer:
  class: SequentialTrainer
  timesteps: 200000
  environment_info: log
